# Secret-string patterns detected by the repo audit.
#
# Each pattern includes:
#   - id: stable identifier (used in JSON output)
#   - regex: matched against blob contents
#   - severity: low | medium | high
#   - entropy_min: optional Shannon-entropy floor (catches random-looking strings
#     even if they don't match a specific provider regex — useful for unknown
#     tokens, JWTs, internal service keys)
#
# The repo audit only inspects blobs <= 1MB. False positives are listed under
# docs/audit-methodology.md.

version: 1

patterns:
  - id: aws_access_key_id
    regex: 'AKIA[0-9A-Z]{16}'
    severity: high
    description: AWS Access Key ID

  - id: aws_secret_access_key
    regex: '(?i)aws(.{0,20})?(secret|sk).{0,5}["'']?[A-Za-z0-9/+=]{40}'
    severity: high
    description: AWS Secret Access Key

  - id: github_pat
    regex: 'ghp_[A-Za-z0-9]{36}'
    severity: high
    description: GitHub Personal Access Token

  - id: github_fine_grained_pat
    regex: 'github_pat_[A-Za-z0-9_]{82}'
    severity: high
    description: GitHub fine-grained PAT

  - id: stripe_live_key
    regex: 'sk_live_[0-9a-zA-Z]{24,99}'
    severity: high
    description: Stripe live secret key

  - id: stripe_test_key
    regex: 'sk_test_[0-9a-zA-Z]{24,99}'
    severity: medium
    description: Stripe test secret key

  - id: openai_api_key
    regex: 'sk-[A-Za-z0-9]{20,}'
    severity: high
    description: OpenAI / Azure OpenAI API key

  - id: anthropic_api_key
    regex: 'sk-ant-[A-Za-z0-9_-]{20,}'
    severity: high
    description: Anthropic API key

  - id: google_api_key
    regex: 'AIza[0-9A-Za-z_-]{35}'
    severity: high
    description: Google Cloud API key

  - id: slack_token
    regex: 'xox[abprs]-[A-Za-z0-9-]{10,}'
    severity: high
    description: Slack token (bot, user, app, etc.)

  - id: jwt_token
    regex: 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
    severity: medium
    description: JSON Web Token

  - id: private_key_block
    regex: '-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----'
    severity: high
    description: PEM private key block

  - id: ssh_private_key_marker
    regex: 'BEGIN OPENSSH PRIVATE KEY'
    severity: high
    description: OpenSSH private key

  - id: db_url_with_password
    regex: '(?i)(postgres|mysql|mongodb|redis)(\+[a-z]+)?://[^\s:@/]+:[^\s:@/]+@'
    severity: medium
    description: Database URL with embedded credentials

  - id: high_entropy_string
    regex: '[A-Za-z0-9+/=_-]{40,}'
    severity: low
    entropy_min: 4.8
    description: |
      Generic high-entropy string. Only flagged if Shannon entropy of the
      match is >= 4.8. Catches unknown tokens / random secrets.

# Files we explicitly skip even if they look like secrets — common noise that
# would otherwise drown the report.
ignore_paths:
  - ".git/"
  - "node_modules/"
  - "venv/"
  - ".venv/"
  - "dist/"
  - "build/"
  - ".next/"
  - "target/"
  - "fixtures/secrets/"
  - "tests/fixtures/"